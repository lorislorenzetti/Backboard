<script>
  const _hbBtn = document.getElementById('nav-hamburger');
  const _hbMenu = document.getElementById('nav-mobile-menu');
  _hbBtn.addEventListener('click', () => {
    const open = _hbMenu.classList.toggle('open');
    _hbBtn.classList.toggle('open', open);
  });
  _hbMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      _hbMenu.classList.remove('open');
      _hbBtn.classList.remove('open');
    });
  });
  const siteNav = document.getElementById('site-nav');
  if (siteNav) {
    const onNavScroll = () => siteNav.classList.toggle('is-scrolled', window.scrollY > 8);
    onNavScroll();
    window.addEventListener('scroll', onNavScroll, { passive: true });
  }
</script>

<div class="cl-page">
  <div class="cl-header">
    <h1>Changelog</h1>

    <div class="cl-loading">

<script>
  marked.setOptions({ gfm: true, breaks: true });

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  async function loadReleases() {
    const container = document.getElementById('cl-list');
    try {
      const res = await fetch('https://api.github.com/repos/lorislorenzetti/bakkboard/releases', {
        headers: { 'Accept': 'application/vnd.github+json' }
      });
      if (!res.ok) throw new Error('GitHub API error ' + res.status);
      const releases = await res.json();
      if (!releases.length) {
        container.innerHTML = '<p class="cl-empty">No releases found.</p>';
        return;
      }
      container.innerHTML = '';
      releases.forEach((r, i) => {
        const version = r.tag_name.startsWith('v') ? r.tag_name : 'v' + r.tag_name;
        const date    = formatDate(r.published_at);
        const body    = r.body ? marked.parse(r.body) : '<p style="color:var(--text-dim);font-style:italic">No release notes.</p>';
        const el = document.createElement('div');
        el.className = 'cl-release';
        el.innerHTML = `
          <div class="cl-aside">
            <div class="cl-version">${version}</div>
            <div class="cl-date">${date}</div>
          </div>
          <div class="cl-body">
            <div class="cl-md">${body}</div>
          </div>
        `;
        container.appendChild(el);
      });
    } catch (e) {
      container.innerHTML = `<p class="cl-error">Could not load releases. Please try again later.</p>`;
    }
  }

  loadReleases();
</script>
